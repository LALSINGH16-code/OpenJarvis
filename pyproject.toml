[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjarvis"
version = "1.0.0"
description = "Open-source AI desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lalsingh", email = "contact@example.com"}
]
keywords = ["ai", "assistant", "desktop", "automation", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Multimedia",
]

dependencies = [
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
gui = [
    "PySide6>=6.0.0",
]
build = [
    "PyInstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/LALSINGH16-code/OpenJarvis"
Repository = "https://github.com/LALSINGH16-code/OpenJarvis.git"
Issues = "https://github.com/LALSINGH16-code/OpenJarvis/issues"

[project.scripts]
openjarvis = "openjarvis.__main__:main"

[tool.setuptools]
packages = ["openjarvis"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=openjarvis --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["openjarvis"]
omit = ["*/tests/*", "*/__main__.py"]
